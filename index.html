function ding(){if(!S.sound)return;try{var a=new (window.AudioContext||window.webkitAudioContext)();var o=a.createOscillator(),g=a.createGain();o.frequency.value=740;o.connect(g);g.connect(a.destination);g.gain.setValueAtTime(.08,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.25);o.start();o.stop(a.currentTime+.26)}catch(e){}}
function nm(k){return S.names[k]||k}
function other(){return S.me==='a'?'b':'a'}
function fmtDate(t){return new Date(t).toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'})}
function fmtTime(t){return new Date(t).toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'})}
function dayKey(t){var d=new Date(t||Date.now());return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}
function daysUntil(iso){var t=new Date(iso+'T00:00:00').getTime();return Math.ceil((t-new Date().setHours(0,0,0,0))/DAY)}
function nextAnnual(m,d){var n=new Date(),y=n.getFullYear();var t=new Date(y,m-1,d);if(t<new Date(n.getFullYear(),n.getMonth(),n.getDate()))t=new Date(y+1,m-1,d);return Math.round((t-new Date(n.getFullYear(),n.getMonth(),n.getDate()))/DAY)}
function dayIdx(){return Math.floor(Date.now()/DAY)}
function modal(html){var m=document.createElement('div');m.className='modal';m.innerHTML='<div class="card glow">'+html+'</div>';m.addEventListener('click',function(e){if(e.target===m)m.remove()});$('#layer').appendChild(m);return m}

function streak(){var n=0,t=Date.now();while(S.checkins[dayKey(t)]&&S.checkins[dayKey(t)].length){n++;t-=DAY}return n}

function doSetup(){
  if(authBusy)return;var n=v('anm'),em=v('aem'),p=raw('apw'),p2=raw('apw2');
  if(!n)return authErr('Enter your name.');
  if(!/^\S+@\S+\.\S+$/.test(em))return authErr('Enter a valid email address.');

  if(p!==p2)return authErr('The two passwords do not match.');

function startBlow(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){toast('Microphone not available. Tap to blow instead.');return}
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(st){
    var ac=new (window.AudioContext||window.webkitAudioContext)(),src=ac.createMediaStreamSource(st),an=ac.createAnalyser();an.fftSize=512;src.connect(an);
    var buf=new Uint8Array(an.fftSize),hot=0;toast('Blow gently towards the microphone');
    (function lp(){
      if(!$('#cake')||blown){st.getTracks().forEach(function(t){t.stop()});try{ac.close()}catch(e){}return}
      an.getByteTimeDomainData(buf);var s=0;for(var i=0;i<buf.length;i++){var x=(buf[i]-128)/128;s+=x*x}
      var rms=Math.sqrt(s/buf.length);hot=rms>.14?hot+1:Math.max(0,hot-1);
      if(hot>8){blowOut();return}
      requestAnimationFrame(lp)
    })()
  }).catch(function(){toast('Microphone permission is off. Tap to blow instead.')})
}

function initScratch(cv){
  var r=cv.getBoundingClientRect(),W=cv.width=Math.max(80,Math.round(r.width)),H=cv.height=Math.max(80,Math.round(r.height)),c=cv.getContext('2d');
  var g=c.createLinearGradient(0,0,W,H);g.addColorStop(0,'#9B5CFF');g.addColorStop(1,'#FF6FAE');c.fillStyle=g;c.fillRect(0,0,W,H);
  c.fillStyle='rgba(255,255,255,.9)';c.font='600 14px Manrope,sans-serif';c.textAlign='center';c.fillText('Scratch me 💜',W/2,H/2+5);
  c.globalCompositeOperation='destination-out';c.fillStyle='#000';var d=false,cnt=0,fin=false;
  function pos(e){var b=cv.getBoundingClientRect();return[(e.clientX-b.left)*W/b.width,(e.clientY-b.top)*H/b.height]}
  function dot(e){var p=pos(e);c.beginPath();c.arc(p[0],p[1],20,0,7);c.fill();if(++cnt%6===0)check()}
  function check(){if(fin)return;var im=c.getImageData(0,0,W,H).data,t=0,n=0;for(var i=3;i<im.length;i+=24){n++;if(im[i]<20)t++}if(t/n>.45){fin=true;cv.style.transition='opacity .5s';cv.style.opacity=0;setTimeout(function(){cv.style.display='none'},520);reasonSeen(+cv.dataset.i)}}
  cv.onpointerdown=function(e){d=true;cv.setPointerCapture(e.pointerId);dot(e)};
  cv.onpointermove=function(e){if(d)dot(e)};
  cv.onpointerup=function(){d=false;check()};
  cv.onpointercancel=function(){d=false}
}

 syncOff:function(){confirmBox('Chat will stay on this phone only until you connect again. Your messages are kept.',function(){S.sync=null;save();syncStart();render()})},
 fbHelp:function(){modal('<h3>Free private database</h3><ol style="padding-left:18px;margin:0;display:flex;flex-direction:column;gap:6px"><li>Open console.firebase.google.com and add a project (turn Analytics off).</li><li>Build, Realtime Database, Create database (any region).</li><li>Open the Rules tab, paste the rules below, press Publish.</li><li>Copy the database URL from the top of the Data tab and paste it here.</li></ol><textarea readonly style="min-height:96px;margin-top:8px">{"rules":{"r":{"$room":{".read":true,".write":true}}}}</textarea><p class="mut">The long random room name works like a password, and everything inside is encrypted.</p><button class="btn pri" data-a="closeModal">Got it</button>')}
});

/* ===== events ===== */
document.addEventListener('change',function(e){
  var t=e.target;if(!t||!t.id)return;
  if(t.id==='dis'){S.dis=+t.value;save();toast(S.dis?'Disappearing messages on':'Disappearing messages off')}
  else if(t.id==='tza'||t.id==='tzb'){S.tz[t.id==='tza'?'a':'b']=t.value;save();pushProfile();render()}
  else if(t.id==='gvfile'&&t.files[0]){if(t.files[0].size>2e6)return toast('Keep the voice file under 2 MB.');saveFile(t.files[0],function(ref){S.gift.final.voice=ref;save();render()})}
  else if(t.id==='gmus'&&t.files[0]){if(t.files[0].size>4e6)return toast('Keep the music under 4 MB.');saveFile(t.files[0],function(ref){S.gift.music=ref;save();render()})}
  else if(t.id==='rfile'&&t.files[0])doRestore(t.files[0])
});
document.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target.id==='pinin'){e.preventDefault();A.pinGo()}});
var bt=0,btT=null;
document.addEventListener('click',function(e){
  var b=e.target.closest&&e.target.closest('.brand');if(!b||b.closest('.splash'))return;
  bt++;clearTimeout(btT);btT=setTimeout(function(){bt=0},1500);
  if(bt>=7){bt=0;modal('<h3>Secret</h3><p>'+esc(fill(S.gift.secret||'Psst. Someone built this just so you would always have one place that is only yours.'))+'</p><button class="btn pri" data-a="closeModal">💜</button>');hearts(12)}
});
window.addEventListener('online',function(){flushQ();poll()});
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')poll()});
setInterval(function(){purge();flushQ()},20000);

/* ===== boot ===== */
var booted=false;
function boot(){
  if(booted)return;booted=true;
  var sp=$('#spname');if(sp&&S.names.b&&S.names.b!=='Her')sp.textContent='for '+S.names.b;
  render();syncStart();
  setTimeout(function(){$('#splash').classList.add('off')},900);
  if(S.msgs.length>20&&Date.now()-(S.lastBackup||0)>14*DAY)setTimeout(function(){toast('Time for a backup: Profile, Chat vault.')},4000)
}
Promise.race([mLoadAll(),new Promise(function(r){setTimeout(r,1500)})]).then(boot);


})();
</script>
